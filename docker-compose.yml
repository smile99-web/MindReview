x-app-env: &app-env
  DATABASE_URL: postgresql://mindreview:mindreview@db:5432/mindreview
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-mindreview-dev-secret-change-me}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
  DOUBAO_TTS_API_KEY: ${DOUBAO_TTS_API_KEY:-}
  DOUBAO_TTS_RESOURCE_ID: ${DOUBAO_TTS_RESOURCE_ID:-seed-tts-2.0}
  DOUBAO_TTS_VOICE_TYPE: ${DOUBAO_TTS_VOICE_TYPE:-zh_female_vv_uranus_bigtts}
  SEEDREAM_API_KEY: ${SEEDREAM_API_KEY:-}
  SEEDREAM_ENDPOINT: ${SEEDREAM_ENDPOINT:-https://ark.cn-beijing.volces.com/api/v3}
  SEEDREAM_MODEL: ${SEEDREAM_MODEL:-doubao-seedream-5-0}

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mindreview-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mindreview
      POSTGRES_PASSWORD: mindreview
      POSTGRES_DB: mindreview
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindreview"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: mindreview-app
    restart: unless-stopped
    ports:
      - "3300:3000"
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  pgdata:
